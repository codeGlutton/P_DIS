; Configuration for DIS plugin runtime localization target (Gather)
[CommonSettings]
SourcePath=Plugins/DIS/Content/Localization/DIS
DestinationPath=Plugins/DIS/Content/Localization/DIS
ManifestName=DIS.manifest
ArchiveName=DIS.archive
NativeCulture=ko-KR
CulturesToGenerate=en
CulturesToGenerate=ko-KR

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Plugins/DIS/Source/DISRuntime/
SearchDirectoryPaths=Plugins/DIS/Config/
ExcludePathFilters=Plugins/DIS/Config/Localization/*
FileNameFilters=*.h
FileNameFilters=*.cpp
FileNameFilters=*.inl
FileNameFilters=*.ini
ShouldGatherFromEditorOnlyData=false

[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=Plugins/DIS/Content/*
ExcludePathFilters=Plugins/DIS/Content/Localization/*
ExcludePathFilters=Plugins/DIS/Content/L10N/*
ExcludePathFilters=Plugins/DIS/Content/Developers/*
ExcludePathFilters=Plugins/DIS/Content/Collections/*
ExcludePathFilters=Plugins/DIS/Content/*Test/*
PackageFileNameFilters=*.umap
PackageFileNameFilters=*.uasset
ShouldExcludeDerivedClasses=false
ShouldGatherFromEditorOnlyData=false
SkipGatherCache=false

[GatherTextStep2]
CommandletClass=GenerateGatherManifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive

[GatherTextStep4]
CommandletClass=GenerateTextLocalizationReport
bWordCountReport=true
WordCountReportName=DIS.csv
bConflictReport=true
ConflictReportName=DIS_Conflicts.txt

