; Configuration for AssetLinter plugin editor localization target (Gather)
[CommonSettings]
SourcePath=Plugins/AssetLinter/Content/Localization/AssetLinter
DestinationPath=Plugins/AssetLinter/Content/Localization/AssetLinter
ManifestName=AssetLinter.manifest
ArchiveName=AssetLinter.archive
NativeCulture=ko-KR
CulturesToGenerate=en
CulturesToGenerate=ko-KR

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Plugins/AssetLinter/Source/
SearchDirectoryPaths=Plugins/AssetLinter/Config/
ExcludePathFilters=Plugins/AssetLinter/Config/Localization/*
FileNameFilters=*.h
FileNameFilters=*.cpp
FileNameFilters=*.inl
FileNameFilters=*.ini
ShouldGatherFromEditorOnlyData=true

[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=Plugins/AssetLinter/Content/*
ExcludePathFilters=Plugins/AssetLinter/Content/Localization/*
ExcludePathFilters=Plugins/AssetLinter/Content/L10N/*
ExcludePathFilters=Plugins/AssetLinter/Content/Developers/*
ExcludePathFilters=Plugins/AssetLinter/Content/Collections/*
ExcludePathFilters=Plugins/AssetLinter/Content/*Test/*
PackageFileNameFilters=*.umap
PackageFileNameFilters=*.uasset
ShouldExcludeDerivedClasses=false
ShouldGatherFromEditorOnlyData=true
SkipGatherCache=false

[GatherTextStep2]
CommandletClass=GenerateGatherManifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive

[GatherTextStep4]
CommandletClass=GenerateTextLocalizationReport
bWordCountReport=true
WordCountReportName=AssetLinter.csv
bConflictReport=true
ConflictReportName=AssetLinter_Conflicts.txt

